<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>潮汐グラフ（3日間）</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    *, *::before, *::after{box-sizing:border-box;}

    body{
      font-family:system-ui,Arial,sans-serif;
      margin:0; padding:12px;
      background:#f5f7fa;
    }

    /* ── ヘッダー ── */
    h1{font-size:1.1rem;margin:0 0 .75rem;line-height:1.4;}
    #portLabel{font-weight:600;}

    /* ── フォーム: スマホは1列、PC(600px~)は横並び ── */
    form{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
    .form-row{display:flex;gap:8px;}
    .form-row .form-group{flex:1;min-width:0;}
    .btn-row{display:flex;gap:8px;}

    .form-group{display:flex;flex-direction:column;gap:3px;}
    .form-group label{font-size:.75rem;font-weight:600;color:#555;}

    select,input[type="date"]{
      width:100%;padding:10px 8px;
      border:1px solid #ccc;border-radius:8px;
      font-size:16px;background:#fff; /* 16px未満でiOSズーム発生 */
      -webkit-appearance:auto;appearance:auto;
    }
    button{
      flex:1;padding:11px 8px;
      border:none;border-radius:8px;
      font-size:16px;font-weight:600;
      cursor:pointer;touch-action:manipulation;
    }
    button[type="submit"]{background:#2563eb;color:#fff;}
    button[type="submit"]:active{background:#1d4ed8;}
    button.print-btn{background:#64748b;color:#fff;}
    button.print-btn:active{background:#475569;}

    @media(min-width:600px){
      form{flex-direction:row;align-items:flex-end;flex-wrap:wrap;}
      .form-row{flex:2;min-width:280px;}
      .btn-row{flex:none;}
      button{white-space:nowrap;}
    }

    /* ── グラフ ──
       Chart.jsはcanvasのwidth/height属性をJSで直接制御する。
       maintainAspectRatio:falseにして、コンテナ高さをCSSで管理する。
    ── */
    #charts{display:grid;gap:12px;}
    .chart-wrap{
      background:#fff;padding:10px;
      border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);
    }
    /* コンテナサイズ = Chart.jsが参照するサイズ */
    .chart-wrap .canvas-container{
      position:relative;
      height:280px;              /* スマホ: 固定高さ */
    }
    @media(min-width:600px){
      .chart-wrap .canvas-container{
        height:auto;
        aspect-ratio:8/3;        /* PC: 幅に対して比率で高さ自動計算 */
      }
    }

    /* ── メッセージ ── */
    .error{color:#d00;margin:.4rem 0;font-size:.9rem;}
    .hint{font-size:.85rem;color:#555;margin:.2rem 0;}

    /* ── 印刷 ── */
    @media print{
      @page{size:A4 portrait;margin:8mm 10mm;}
      body{padding:0;background:#fff;}
      form,#hint,#err{display:none;}
      h1{margin:0 0 2mm;font-size:12pt;}
      #charts{gap:2mm;}
      .chart-wrap{box-shadow:none;padding:1mm 0;border-radius:0;break-inside:avoid;}
      .chart-wrap .canvas-container{height:75mm;}
    }
  </style>
</head>
<body>
<h1>🌊 潮汐グラフ <span id="portLabel"></span></h1>
<form id="ctrl">
  <div class="form-row">
    <div class="form-group">
      <label for="prefSelect">都道府県</label>
      <select id="prefSelect" required></select>
    </div>
    <div class="form-group">
      <label for="portSelect">港</label>
      <select id="portSelect" required></select>
    </div>
  </div>
  <div class="form-group">
    <label for="dateInput">日付</label>
    <input type="date" id="dateInput" required>
  </div>
  <div class="btn-row">
    <button type="submit">表示</button>
    <button type="button" class="print-btn" onclick="printCharts()">🖨 印刷</button>
  </div>
</form>
<p class="error" id="err"></p>
<p class="hint" id="hint"></p>
<div id="charts"></div>

/**************** DOM refs *****************/
const prefSel = document.getElementById('prefSelect');
const portSel = document.getElementById('portSelect');
const portLbl = document.getElementById('portLabel');
const errEl   = document.getElementById('err');
const hintEl  = document.getElementById('hint');
const chartsDiv = document.getElementById('charts');
let charts = [];

// 都道府県セレクト初期化
prefectures.forEach((p, i) => {
  prefSel.insertAdjacentHTML('beforeend', `<option value="${i}">${p.name}</option>`);
});

// 都道府県変更時 → 港リスト更新
prefSel.addEventListener('change', () => {
  const pref = prefectures[prefSel.value];
  portSel.innerHTML = '';
  if (pref) {
    pref.ports.forEach(p => {
      portSel.insertAdjacentHTML('beforeend', `<option value="${p.hc}">${p.name}</option>`);
    });
  }
});

// 初期値: 愛媛県 松山
prefSel.value = prefectures.findIndex(p => p.pc === 38);
prefSel.dispatchEvent(new Event('change'));
// 松山(hc=13)を初期選択
portSel.value = 13;
document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

/**************** APIの flood/edd から満潮・干潮データを取得 *****************/
function extractPeaks(dayData) {
  // APIが返す正確な時刻・潮位をそのまま使う（自力検出より精度が高い）
  const pk = (dayData.flood || []).map(f => ({x: f.time, y: f.cm}));
  const tr = (dayData.edd   || []).map(e => ({x: e.time, y: e.cm}));
  return {pk, tr};
}

/**************** API呼び出し *****************/
async function fetchTide(pc, hc, date) {
  const y  = date.getFullYear();
  const m  = String(date.getMonth() + 1).padStart(2, '0');
  const dy = String(date.getDate()).padStart(2, '0');
  const url = `/api/tide?pc=${pc}&hc=${hc}&yr=${y}&mn=${m}&dy=${dy}&rg=day`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  const j = await res.json();
  if (j.error) throw new Error(j.error);
  if (j.status !== 1) throw new Error(j.message || 'APIエラー');
  return j;
}

/**************** フォントサイズ設定 *****************/
const FONT_MOBILE = {title: 12, legend: 11, tick: 10, axisTitle: 10};
const FONT_SCREEN = {title: 18, legend: 15, tick: 12, axisTitle: 12};
const FONT_PRINT  = {title: 28, legend: 22, tick: 18, axisTitle: 18};
let fontSizes = window.innerWidth < 600 ? FONT_MOBILE : FONT_SCREEN;

/**************** 描画 *****************/
async function draw() {
  errEl.textContent = '';
  hintEl.textContent = '読み込み中…';
  charts.forEach(c => c.destroy());
  charts = [];
  chartsDiv.innerHTML = '';

  const pref = prefectures[prefSel.value];
  const hc = portSel.value;
  const portName = portSel.selectedOptions[0].textContent;
  portLbl.textContent = `（${pref.name} ${portName}）`;

  const baseDate = new Date(document.getElementById('dateInput').value);

  try {
    for (let offset = -1; offset <= 1; offset++) {
      const d = new Date(baseDate);
      d.setDate(d.getDate() + offset);

      const j = await fetchTide(pref.pc, hc, d);
      const dateKey = Object.keys(j.tide.chart)[0];
      const dayData = j.tide.chart[dateKey];
      const list = dayData.tide;
      const labels = list.map(t => t.time);
      const data = list.map(t => t.cm);
      const {pk, tr} = extractPeaks(dayData);

      // 潮名・月齢情報
      const moonTitle = dayData.moon?.title || '';
      const moonAge = dayData.moon?.age != null ? `月齢${dayData.moon.age}` : '';
      const sunRise = dayData.sun?.rise || '';
      const sunSet  = dayData.sun?.set || '';
      const dayLabel = offset === -1 ? '前日' : offset === 0 ? '指定日' : '翌日';
      const subtitle = [moonTitle, moonAge, sunRise ? `日出${sunRise}` : '', sunSet ? `日没${sunSet}` : ''].filter(Boolean).join(' / ');

      const wrap = document.createElement('div');
      wrap.className = 'chart-wrap';
      const container = document.createElement('div');
      container.className = 'canvas-container';
      const canvas = document.createElement('canvas');
      container.appendChild(canvas);
      wrap.appendChild(container);
      chartsDiv.appendChild(wrap);

      const isMobile = window.innerWidth < 600;
      // スマホ: 1行タイトル（日付のみ）、PC: 2行（日付＋潮名/日出没）
      const titleText = isMobile
        ? `${dateKey}（${dayLabel}）`
        : (subtitle ? [`${dateKey}（${dayLabel}）`, subtitle] : `${dateKey}（${dayLabel}）`);

      charts.push(new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            {label: '潮位(cm)', data, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.08)', borderWidth: 2.5, pointRadius: 0, tension: .2, fill: true},
            {type: 'scatter', label: '満潮', data: pk, pointRadius: 6, backgroundColor: '#dc2626', borderColor: '#dc2626'},
            {type: 'scatter', label: '干潮', data: tr, pointStyle: 'rectRot', pointRadius: 6, backgroundColor: '#0284c7', borderColor: '#0284c7'}
          ]
        },
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {display: true, text: titleText, align: 'start', font: {size: fontSizes.title, weight: 'bold'}},
            legend: {labels: {boxWidth: 12, font: {size: fontSizes.legend}}},
            tooltip: {
              callbacks: {
                label: ctx => `${ctx.dataset.label === '潮位(cm)' ? '' : ctx.dataset.label + ': '}${ctx.formattedValue} cm`
              }
            }
          },
          interaction: {mode: 'nearest', axis: 'x', intersect: false},
          scales: {
            x: {
              title: {display: !isMobile, text: '時刻', font: {size: fontSizes.axisTitle}},
              ticks: {autoSkip: false, color: '#333', font: {size: fontSizes.tick}, callback: v => labels[v]?.endsWith(':00') ? labels[v] : ''},
              grid: {color: '#e5e7eb'}
            },
            y: {
              title: {display: !isMobile, text: '潮位(cm)', font: {size: fontSizes.axisTitle}},
              ticks: {color: '#333', font: {size: fontSizes.tick}},
              grid: {color: '#e5e7eb'}
            }
          }
        }
      }));
    }
    hintEl.textContent = '';
  } catch (e) {
    hintEl.textContent = '';
    errEl.textContent = 'データ取得失敗: ' + e.message;
  }
}

document.getElementById('ctrl').addEventListener('submit', e => { e.preventDefault(); draw(); });

/**************** 印刷用：大フォントで再描画→印刷→戻す *****************/
async function printCharts() {
  if (!charts.length) { alert('先にグラフを表示してください'); return; }
  fontSizes = FONT_PRINT;
  await draw();
  // Chart.jsのアニメーション完了を待つ
  await new Promise(resolve => setTimeout(resolve, 500));
  window.print();
  // 印刷ダイアログ閉じた後に画面用に戻す
  fontSizes = FONT_SCREEN;
  draw();
}

// 初回表示
draw();
</script>

</html>
